name: Validate JSON Schema files
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Install jsonschema
        run: pip install jsonschema==3.2.0
      - run: |
          for i in **/*.json; do
            echo "Validating $i"
            jsonschema $i
          done
